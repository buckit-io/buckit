name: Release

on:
  push:
    tags:
      - 'RELEASE.*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Build binary
        env:
          CGO_ENABLED: 0
          BUCKIT_RELEASE: RELEASE
        run: |
          # Extract timestamp from tag (e.g., RELEASE.2026-05-10T21-48-00Z.rc1 -> 2026-05-10T21-48-00Z)
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^RELEASE\.//' | sed 's/\.rc[0-9]*$//')
          # Pass RC suffix via BUCKIT_HOTFIX so it's embedded in the binary's ReleaseTag
          if [[ "${{ github.ref_name }}" =~ \.(rc[0-9]+)$ ]]; then
            export BUCKIT_HOTFIX="${BASH_REMATCH[1]}"
          fi
          LDFLAGS=$(go run buildscripts/gen-ldflags.go "${VERSION}")
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -tags kqueue -trimpath --ldflags "${LDFLAGS}" -o buckit-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.${{ github.ref_name }}

      - name: Generate checksum
        run: |
          sha256sum buckit-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.${{ github.ref_name }} > buckit-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.${{ github.ref_name }}.sha256sum

      - name: Sign with minisign
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          go install aead.dev/minisign/cmd/minisign@v0.2.1
          echo "$MINISIGN_PRIVATE_KEY" | base64 -d > /tmp/minisign.key
          echo "$MINISIGN_PASSWORD" | minisign -Sm buckit-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.${{ github.ref_name }} -s /tmp/minisign.key
          shred -u /tmp/minisign.key

      - name: Build packages
        if: matrix.goos == 'linux'
        env:
          NFPM_VERSION: 2.46.3
          PKG_ARCH: ${{ matrix.goarch }}
        run: |
          wget -q "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo apt install -y "./nfpm_${NFPM_VERSION}_amd64.deb"
          mkdir -p dist
          cp "buckit-linux-${PKG_ARCH}.${{ github.ref_name }}" dist/buckit
          # Convert RELEASE.2026-05-11T17-20-40Z[.rcN] -> 20260511172040.0.0
          PKG_VERSION=$(echo "${{ github.ref_name }}" | sed 's/^RELEASE\.//' | sed 's/\.rc[0-9]*$//' | tr -d '\-:TZ').0.0
          export PKG_VERSION
          for pkg in rpm deb apk; do
            nfpm package -f packaging/nfpm.yaml -p "$pkg" -t dist/
          done

      - name: Generate package checksums
        if: matrix.goos == 'linux'
        run: |
          for pkg in dist/*.deb dist/*.rpm dist/*.apk; do
            sha256sum "$pkg" > "${pkg}.sha256sum"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            buckit-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.${{ github.ref_name }}
            buckit-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.${{ github.ref_name }}.sha256sum
            buckit-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.${{ github.ref_name }}.minisig
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.deb.sha256sum
            dist/*.rpm.sha256sum
            dist/*.apk.sha256sum

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare binaries for Docker
        run: |
          cp artifacts/buckit-linux-amd64.${{ github.ref_name }} buckit-amd64.${{ github.ref_name }}
          cp artifacts/buckit-linux-arm64.${{ github.ref_name }} buckit-arm64.${{ github.ref_name }}
          cp artifacts/buckit-linux-amd64.${{ github.ref_name }}.minisig buckit-amd64.${{ github.ref_name }}.minisig
          cp artifacts/buckit-linux-arm64.${{ github.ref_name }}.minisig buckit-arm64.${{ github.ref_name }}.minisig
          chmod +x buckit-*.${{ github.ref_name }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          TAGS="ghcr.io/buckit-io/buckit:${{ github.ref_name }}"
          TAGS="${TAGS},docker.io/buckitio/buckit:${{ github.ref_name }}"
          if [[ "${{ github.ref_name }}" != *".rc"* ]]; then
            TAGS="${TAGS},ghcr.io/buckit-io/buckit:latest"
            TAGS="${TAGS},docker.io/buckitio/buckit:latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            RELEASE=${{ github.ref_name }}

  publish:
    needs: [build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \
            ! -name 'buckit.rpm' \
            ! -name 'buckit.deb' \
            ! -name 'buckit.apk' \
            ! -name 'buckit.rpm.sha256sum' \
            ! -name 'buckit.deb.sha256sum' \
            ! -name 'buckit.apk.sha256sum' \
            -exec cp {} release-assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '.rc') }}
          files: release-assets/*

  update-gh-pages:
    if: "!contains(github.ref_name, '.rc')"
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish stable download files
        run: |
          tag="${{ github.ref_name }}"

          # zip_binary <artifact> <inner-name> <platform>
          # Zips the binary with a clean name (no version tag), publishes to
          # release/<platform>/buckit.zip (latest) and
          # archives/<platform>/buckit.<tag>.zip (versioned history).
          zip_binary() {
            local src="$1" inner="$2" platform="$3"
            local rel="pages/server/buckit/release/${platform}"
            local arc="pages/server/buckit/archives/${platform}"
            mkdir -p "${rel}" "${arc}"
            cp "${src}" "${inner}"
            zip -q binary.zip "${inner}"
            rm "${inner}"
            cp binary.zip "${rel}/buckit.zip"
            sha=$(sha256sum "${rel}/buckit.zip" | awk '{print $1}')
            echo "${sha}  buckit.zip" > "${rel}/buckit.zip.sha256sum"
            cp binary.zip "${arc}/buckit.${tag}.zip"
            sha=$(sha256sum "${arc}/buckit.${tag}.zip" | awk '{print $1}')
            echo "${sha}  buckit.${tag}.zip" > "${arc}/buckit.${tag}.zip.sha256sum"
            rm binary.zip
          }

          zip_binary "artifacts/buckit-linux-amd64.${tag}"       buckit     linux-amd64
          zip_binary "artifacts/buckit-linux-arm64.${tag}"       buckit     linux-arm64
          zip_binary "artifacts/buckit-windows-amd64.exe.${tag}" buckit.exe windows-amd64
          zip_binary "artifacts/buckit-darwin-arm64.${tag}"      buckit     darwin-arm64

          # Self-update sha256sum files (hash of the raw binary, not the zip).
          sha=$(awk '{print $1}' "artifacts/buckit-linux-amd64.${tag}.sha256sum")
          echo "${sha}  buckit.${tag}" > "pages/server/buckit/release/linux-amd64/buckit.sha256sum"
          sha=$(awk '{print $1}' "artifacts/buckit-linux-arm64.${tag}.sha256sum")
          echo "${sha}  buckit.${tag}" > "pages/server/buckit/release/linux-arm64/buckit.sha256sum"
          sha=$(awk '{print $1}' "artifacts/buckit-windows-amd64.exe.${tag}.sha256sum")
          echo "${sha}  buckit.exe.${tag}" > "pages/server/buckit/release/windows-amd64/buckit.sha256sum"
          sha=$(awk '{print $1}' "artifacts/buckit-darwin-arm64.${tag}.sha256sum")
          echo "${sha}  buckit.${tag}" > "pages/server/buckit/release/darwin-arm64/buckit.sha256sum"

          # publish_package <src-glob> <stable-name> <platform>
          # Copies to release/<platform>/<stable-name> (latest) and
          # archives/<platform>/buckit.<tag>.<ext> (versioned history).
          publish_package() {
            local src="$1" name="$2" platform="$3"
            local ext="${name##*.}"
            local rel="pages/server/buckit/release/${platform}"
            local arc="pages/server/buckit/archives/${platform}"
            cp "${src}" "${rel}/${name}"
            sha=$(sha256sum "${rel}/${name}" | awk '{print $1}')
            echo "${sha}  ${name}" > "${rel}/${name}.sha256sum"
            cp "${src}" "${arc}/buckit.${tag}.${ext}"
            sha=$(sha256sum "${arc}/buckit.${tag}.${ext}" | awk '{print $1}')
            echo "${sha}  buckit.${tag}.${ext}" > "${arc}/buckit.${tag}.${ext}.sha256sum"
          }

          # Linux packages: already compressed. Published at stable URLs and archived.
          publish_package artifacts/dist/buckit_*_amd64.deb   buckit.deb linux-amd64
          publish_package artifacts/dist/buckit-*.x86_64.rpm  buckit.rpm linux-amd64
          publish_package artifacts/dist/buckit_*_x86_64.apk  buckit.apk linux-amd64
          publish_package artifacts/dist/buckit_*_arm64.deb   buckit.deb linux-arm64
          publish_package artifacts/dist/buckit-*.aarch64.rpm buckit.rpm linux-arm64
          publish_package artifacts/dist/buckit_*_aarch64.apk buckit.apk linux-arm64

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          keep_files: true
